[project]
name = "datasage"
version = "0.1.0"
description = "DataSage — The AI Behind Better Buys"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["datasage*"]
exclude = ["migrations*", "tests*"]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "N802"]

[tool.ruff.lint.isort]
known-first-party = ["datasage"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["geoalchemy2.*", "jose.*", "passlib.*", "redis.*", "shap.*", "xgboost.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
